user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 12m;
    client_body_buffer_size 256k;

    # Явные пути: каталоги по умолчанию принадлежат пользователю nginx,
    # а воркеры у нас работают под www-data.
    client_body_temp_path /var/lib/nginx/tmp/client_body;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
    proxy_temp_path /var/lib/nginx/tmp/proxy;
    scgi_temp_path /var/lib/nginx/tmp/scgi;
    uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Собранные ассеты и загруженные фотографии отдаёт nginx.
        location ~* ^/(build|images|storage)/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 60;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
